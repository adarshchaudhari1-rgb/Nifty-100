name: Trading Agent

on:
  schedule:
    - cron: "30,35,40,45,50,55 4 * * 1-5"
    - cron: "*/5 5-8 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45,50 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nifty_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nifty_agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run agent
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python agent.py
      - name: Save trades
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trade_log.json daily_watchlist.json || true
          git diff --cached --quiet || (git commit -m "update trades" && git pull --rebase && git push)
