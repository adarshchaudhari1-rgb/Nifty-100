name: Daily Report

on:
  schedule:
    - cron: "5 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: nifty_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nifty_agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python agent.py --report > report.txt
      - name: Post to Issue 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --body-file report.txt
